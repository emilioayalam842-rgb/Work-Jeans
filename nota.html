<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nota de venta | Works Jeans</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/img/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/assets/img/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1e1e1e; background: #f3f3f3; }
    .sheet { max-width: 720px; margin: 24px auto; background: #fff; padding: 36px 40px; border: 1.5px solid #0f0f0f; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; border-bottom: 3px solid #0f0f0f; padding-bottom: 18px; }
    .top img { height: 54px; }
    .store { font-size: 0.82rem; color: #444; line-height: 1.5; margin-top: 8px; }
    .title { text-align: right; }
    .title h1 { margin: 0; font-size: 1.4rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .title p { margin: 4px 0 0; font-size: 0.85rem; color: #444; }
    .badge { display: inline-block; background: #ffd600; padding: 4px 10px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 8px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 22px 0; font-size: 0.9rem; line-height: 1.55; }
    .cols h3 { margin: 0 0 6px; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: #6a6a6a; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.92rem; }
    th { text-align: left; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #6a6a6a; border-bottom: 1.5px solid #0f0f0f; padding: 8px 6px; }
    td { padding: 10px 6px; border-bottom: 1px solid #dcdcdc; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    .total { display: flex; justify-content: flex-end; gap: 32px; margin-top: 14px; font-size: 1.1rem; font-weight: 700; }
    .notes { margin-top: 24px; font-size: 0.88rem; color: #444; border-top: 1px solid #dcdcdc; padding-top: 14px; }
    .foot { margin-top: 28px; font-size: 0.78rem; color: #6a6a6a; text-align: center; line-height: 1.6; }
    .actions { max-width: 720px; margin: 0 auto 32px; display: flex; gap: 10px; justify-content: flex-end; }
    .actions button, .actions a { font: inherit; font-weight: 600; padding: 10px 18px; border: 1.5px solid #0f0f0f; background: #ffd600; cursor: pointer; text-decoration: none; color: #0f0f0f; }
    .actions a { background: #fff; }
    .error { max-width: 720px; margin: 40px auto; text-align: center; color: #b00020; }
    @media print {
      body { background: #fff; }
      .sheet { margin: 0; border: 0; padding: 0; max-width: none; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <a href="workmapadmin.html">← Volver al panel</a>
    <button type="button" onclick="window.print()">Imprimir / Guardar PDF</button>
  </div>
  <div class="sheet" id="sheet" hidden>
    <div class="top">
      <div>
        <img src="assets/img/works-jeans-logo.png" alt="Works Jeans">
        <div class="store" id="store"></div>
      </div>
      <div class="title">
        <h1>Nota de venta</h1>
        <p id="orderId"></p>
        <p id="orderDate"></p>
        <span class="badge" id="orderStatus"></span>
      </div>
    </div>
    <div class="cols">
      <div>
        <h3>Cliente</h3>
        <div id="customer"></div>
      </div>
      <div>
        <h3>Envío</h3>
        <div id="shipping"></div>
      </div>
    </div>
    <table>
      <thead><tr><th>Producto</th><th>Talla</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead>
      <tbody id="items"></tbody>
    </table>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <div class="notes" id="notes" hidden></div>
    <div class="foot">Gracias por tu compra. Cambios de talla dentro de 15 días con la prenda sin uso y con etiquetas.<br>www.workjeans.mx</div>
  </div>
  <p class="error" id="error" hidden></p>

  <script>
    const STATUS_LABELS = { pendiente: 'Pendiente', pagado: 'Pagado', preparacion: 'En preparación', enviado: 'Enviado', entregado: 'Entregado', cancelado: 'Cancelado' };
    const money = (c) => (c / 100).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const id = new URLSearchParams(location.search).get('id');

    async function load() {
      const [orderRes, settingsRes] = await Promise.all([fetch(`/api/admin/orders/${encodeURIComponent(id)}`), fetch('/api/settings')]);
      if (orderRes.status === 401) throw new Error('Inicia sesión en el panel para ver la nota.');
      if (!orderRes.ok) throw new Error('Pedido no encontrado.');
      const order = await orderRes.json();
      const settings = await settingsRes.json();

      document.getElementById('store').innerHTML = `${settings.storeName || 'Works Jeans'}<br>${settings.address || ''}<br>Tel. ${settings.phoneDisplay || ''}`;
      document.getElementById('orderId').textContent = `Pedido ${order.id}`;
      document.getElementById('orderDate').textContent = new Date(order.createdAt).toLocaleString('es-MX', { dateStyle: 'long', timeStyle: 'short' });
      document.getElementById('orderStatus').textContent = `${STATUS_LABELS[order.status] || order.status} · ${order.source === 'stripe' ? 'Tarjeta' : 'WhatsApp'}`;
      document.getElementById('customer').innerHTML = [order.customerName || 'Sin nombre', order.customerPhone, order.customerEmail].filter(Boolean).map(esc).join('<br>');
      const ship = order.shipping ? [order.shipping.name, order.shipping.line1, order.shipping.line2, [order.shipping.city, order.shipping.state, order.shipping.postalCode].filter(Boolean).join(', ')].filter(Boolean).map(esc) : [];
      if (order.tracking && (order.tracking.carrier || order.tracking.number)) ship.push(`<strong>${esc([order.tracking.carrier, order.tracking.number].filter(Boolean).join(' · '))}</strong>`);
      document.getElementById('shipping').innerHTML = ship.length ? ship.join('<br>') : 'Entrega en tienda / por confirmar';
      document.getElementById('items').innerHTML = order.items.map((i) => `<tr><td>${esc(i.name)}</td><td>${esc(i.size) || '—'}</td><td class="num">${i.quantity}</td><td class="num">${money(i.priceCents)}</td><td class="num">${money(i.priceCents * i.quantity)}</td></tr>`).join('');
      document.getElementById('total').textContent = money(order.totalCents);
      if (order.notes) {
        document.getElementById('notes').textContent = `Notas: ${order.notes}`;
        document.getElementById('notes').hidden = false;
      }
      document.title = `Nota ${order.id} | Works Jeans`;
      document.getElementById('sheet').hidden = false;
    }

    load().catch((err) => {
      const el = document.getElementById('error');
      el.textContent = err.message;
      el.hidden = false;
    });
  </script>
</body>
</html>
